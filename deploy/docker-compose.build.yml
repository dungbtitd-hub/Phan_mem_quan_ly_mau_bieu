# Build image từ mã nguồn trên máy có mạng (thay cho tải image dựng sẵn). Dùng từ thư mục gốc repo:
#   cp deploy/.env.example deploy/.env   # rồi sửa FP_VERSION=dev và các mật khẩu
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml --env-file deploy/.env up -d --build
services:
  migrate:
    build: { context: .., dockerfile: deploy/docker/migrate.Dockerfile }
  api:
    build: { context: .., dockerfile: deploy/docker/api.Dockerfile }
  web:
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile }
