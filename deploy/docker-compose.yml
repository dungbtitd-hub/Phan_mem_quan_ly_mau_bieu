# Cổng quản lý mẫu biểu — triển khai trên máy chủ.
# Mọi giá trị lấy từ tệp .env cùng thư mục (xem .env.example).
name: formportal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  # Chạy một lần: áp dụng migration SQL chưa chạy và dữ liệu tham chiếu, rồi thoát.
  migrate:
    image: ${FP_IMAGE_PREFIX:-ghcr.io/dungbtitd-hub/phan_mem_quan_ly_mau_bieu}/migrate:${FP_VERSION:?Thiếu FP_VERSION}
    restart: "no"
    command: ${MIGRATE_ARGS:-}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  api:
    image: ${FP_IMAGE_PREFIX:-ghcr.io/dungbtitd-hub/phan_mem_quan_ly_mau_bieu}/api:${FP_VERSION}
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=50"
      AdminSeed__Username: ${ADMIN_INITIAL_USERNAME:-admin}
      AdminSeed__Password: ${ADMIN_INITIAL_PASSWORD:-}
      Upload__MaxBytes: ${MAX_UPLOAD_BYTES:-31457280}
      ClamAv__Enabled: ${CLAMAV_ENABLED:-false}
      ClamAv__Host: clamav
      ClamAv__Port: "3310"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: UTC
    volumes:
      - files:/data/files
      - dpkeys:/data/keys
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${FP_IMAGE_PREFIX:-ghcr.io/dungbtitd-hub/phan_mem_quan_ly_mau_bieu}/web:${FP_VERSION}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      API_UPSTREAM: api:8080
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./branding:/usr/share/nginx/brand:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  # Tùy chọn: quét mã độc. Bật bằng: COMPOSE_PROFILES=clamav và CLAMAV_ENABLED=true trong .env
  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 40M
    volumes:
      - clamdb:/var/lib/clamav

volumes:
  pgdata:
  files:
  dpkeys:
  clamdb:
