# Dùng khi PHÁT TRIỂN: chỉ chạy PostgreSQL để chạy backend/frontend trên máy lập trình.
# Triển khai máy chủ: dùng bộ cài (thư mục deploy/, xem docs/HUONG-DAN-CAI-DAT.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # chỉ mở cho máy cục bộ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
